# ==========================================
# EXPERIMENT IDENTIFICATION
# ==========================================
seed: 42                           
output_dir: "./output"
bulk: False

# ==========================================
# GLOBAL PHYSICS CONSTANTS
# ==========================================
physics: &phys_constants
  equation: "viscoelastic_residual_Fung_2D"
  relaxation_modulus: 15.0
  stress_scaling_factor: 0.88
  c_constants: [13.0, 13.0, 0.0]     
  stress: [15.0, 15.0, 0.0]           
  density: 1.0                        
  body_force: [0.0, 0.0]              

# ==========================================
# MODEL CONFIGURATION
# ==========================================
model:
  model_name: "2d_pinn_viscoelastic"
  architecture: "MLP"
  in_channels: 2                 
  hidden_layers: 4
  hidden_dim: 64
  out_class: 2                        

# ==========================================
# DATA & SPATIO-TEMPORAL DOMAIN
# ==========================================
data:
  dataset_name: "time_points.pt"
  data_dir: "./data/synt"
  batch_size: 1024
  num_workers: 4                   

domain:
  x_range: [0.0, 1.0]
  y_range: [0.0, 1.0]
  t_range: [0.0, 1.0]
  n_collocation: 5000
  n_bc: 500

# ==========================================
# TRAINING CONFIGURATION
# ==========================================
training:
  device: "cpu"
  epochs: 500
  loss_weights:
    lambda_haslach: 0
    lambda_momentum: 10
    lambda_bc: 10

# ==========================================
# OPTIMIZER
# ==========================================
optimizer:
  name: "adam"                    
  lr: 0.02                        
  weight_decay: 0.0