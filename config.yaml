# ==========================================
# EXPERIMENT & DATA
# ==========================================
seed: 42
output_dir: "./output"
bulk: false

data:
  dataset_name: "inertial_dataset_sin.pt"
  data_dir: "./data/synt"
  batch_size: 1
  num_workers: 0

domain:
  x_range: [0.0, 1.0]
  y_range: [0.0, 1.0]
  t_range: [0.0, 2.0]
  nx: 10
  ny: 10
  n_steps: 200

# ==========================================
# MODEL CONFIGURATION
# ==========================================
model:
  model_name: "MGN_2D_sin_pull"
  type: "standard"
  node_in_dim: 8
  edge_in_dim: 6     
  latent_dim: 64
  hidden_dim: 64
  num_layers: 4
  output_dim: 2      

# ==========================================
# TRAINING CONFIGURATION
# ==========================================
training:
  method: "base"
  device: "cuda:0"
  epochs: 100
  
  causal_annealing:
    eps_init: 1e-4
    eps_final: 10.0

  loss_weights:
    lambda_data: 1.0
    lambda_dirichlet: 10.0
    lambda_neumann: 100.0
    lambda_pako: 10.0

# ==========================================
# OPTIMIZER
# ==========================================
optimizer:
  name: "adam"
  lr: 0.001
  weight_decay: 0.0

# ==========================================
# GLOBAL PHYSICS CONSTANTS
# ==========================================
physics:
  equation: "ogden_compressible"
  tissue: "default"
  alphas:
    default: [1.3, 5.0, -2.0]
  mus:
    default: [6.3e5, 1.2e3, -1.0e4]
  lam: 6.0e5
  beta: 2.0
  rho_0: 1000.0
  body_force: [0.0, 0.0]
  sigma_max: 1.5e5