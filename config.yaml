# ==========================================
# EXPERIMENT IDENTIFICATION
# ==========================================
seed: 42                           
output_dir: "./output"

# ==========================================
# MODEL CONFIGURATION
# ==========================================
model:
  model_name: "elastic_1d_pinn_MCL"
  architecture: "MMLP"
  in_channels: 1
  hidden_layers: 3
  hidden_dim: 32
  out_class: 1

# ==========================================
# DATA & DATA LOADING
# ==========================================
data:
  dataset_name: "elastic_1d_data.pt"
  data_dir: "./data/synt"
  batch_size: 64
  num_workers: 4                   
  normalisation: False

synt:
  period: [0.0, 1.0, 500]
  parameters:
    area: [0.0, 2.0, 500]
    young: 100.0
    ext_force: [0.0, 10.0, 100] 
    int_force: 2.0
  data_dir: "./data/synt"

# ==========================================
# TRAINING HYPERPARAMETERS
# ==========================================
training:
  epochs: 3000
  ramp_epochs: 1500
  device: "cpu"  
  lambda_ic: 1e1
  lambda_bc: 1e1
  lambda_r: 1
  load_continuation: True

# ==========================================
# OPTIMIZER & SCHEDULER
# ==========================================
optimizer:
  name: "adam"                    
  lr: 0.001                        
  weight_decay: 0.0

# ==========================================
# PHYSISC
# ==========================================
physics:
  equation: elastic_1d_residual
  parameters:
    area: 1.0
    young: 100.0
    ext_force: 10.0
    int_force: 2.0

# ==========================================
# CHECKPOINTING & LOGGING
# ==========================================
logging:
  log_interval: 100                
  save_top_k: 3                    
  checkpoint_dir: "./output/checkpoints"
  use_wandb: false                