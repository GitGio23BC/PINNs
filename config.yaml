seed: 42
output_dir: "./output"
bulk: True

domain:
  x_range: [0.0, 1.0]
  y_range: [0.0, 1.0]
  t_range: [0.5, 1.5]
  nx: 10
  ny: 10
  n_steps: 100

data:
  data_dir: "./data"
  dataset_name: "ground_truth_2d.pt"

model:
  name: "PINNAn"
  architecture: "ModMLP"       
  type: "ansatz_space"         
  num_layers: 4
  hidden_dim: 128

physics:
  c: 1.0
  c1: 1.0
  c2: 1.0
  c3: 0.5
  k_relax: 2.0
  body_force: [0.0, 0.0]
  sigma_max: 1.0

optimizer:
  lr: 1e-3
  weight_decay: 0.0
  lbfgs_lr: 0.5

training:
  device: "cuda"               
  method: "standard"           
  adam_epochs: 100
  lbfgs_epochs: 50
  window_size: 10
  loss_weights:
    lambda_data: 1.0
    lambda_haslach: 1.0
    lambda_momentum: 1.0
    lambda_initial: 10.0
    lambda_bc_base: 10.0       
    lambda_bc_tip: 10.0