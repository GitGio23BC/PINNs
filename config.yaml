# ==========================================
# EXPERIMENT IDENTIFICATION
# ==========================================
seed: 42                           
output_dir: "./output"

# ==========================================
# GLOBAL PHYSICS CONSTANTS
# ==========================================
physics: &phys_constants
  equation: elastic_1d_residual
  young: 100.0
  int_force: 2.0

# ==========================================
# MODEL CONFIGURATION
# ==========================================
model:
  model_name: "elastic_1d_pinn_parametric"
  architecture: "MLP"
  in_channels: 3
  hidden_layers: 3
  hidden_dim: 32
  out_class: 1

# ==========================================
# DATA & DATA LOADING
# ==========================================
data:
  dataset_name: "elastic_1d_data.pt"
  data_dir: "./data/synt"
  batch_size: 64
  num_workers: 4                   

synt:
  domain: [0.0, 10.0, 1000]
  parameters:
    area: 2
    young: 100.0
    ext_force: 10
    int_force: 2.0
  data_dir: "./data/synt"

# ==========================================
# TRAINING CONFIGURATION
# ==========================================
training:
  device: "cpu"
  epochs: 5000
  ramp_epochs: 3000
  load_continuation: true
  domain: [0.0, 10.0, 1000]       
  parameters:
    <<: *phys_constants
    area_range: [0.5, 2.0]      
    ext_force_range: [0.0, 10.0]
  loss_weights:
    lambda_ic: 1e3
    lambda_bc: 1e3
    lambda_r: 1e1

# ==========================================
# TESTING 
# ==========================================
testing:
  device: "cpu" 
  domain: [0.0, 2.0, 2000]     
  parameters:
    <<: *phys_constants
    area: 0.5  
    ext_force: 1

# ==========================================
# OPTIMIZER
# ==========================================
optimizer:
  name: "adam"                    
  lr: 0.001                        
  weight_decay: 0.0