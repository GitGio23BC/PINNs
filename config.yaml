# ==========================================
# EXPERIMENT IDENTIFICATION
# ==========================================
seed: 42                           
output_dir: "./output"

# ==========================================
# GLOBAL PHYSICS CONSTANTS
# ==========================================
physics: &phys_constants
  equation: elastic_1d_residual
  young: 100.0
  int_force: 2.0

# ==========================================
# MODEL CONFIGURATION
# ==========================================
model:
  model_name: "elastic_1d_pinn_parametric_inverse"
  architecture: "MLP"
  in_channels: 4       
  hidden_layers: 4
  hidden_dim: 64
  out_class: 2                        

# ==========================================
# DATA & DATA LOADING
# ==========================================
data:
  dataset_name: "elastic_1d_data.pt"
  data_dir: "./data/synt"
  batch_size: 64
  num_workers: 4                   

domain:
  x_range: [0.0, 2.0]
  y_range: [0.0, 2.0]
  t_range: [0.0, 2.0]
  F_range: [0.0, 2.0]
  n_collocation: 500
  n_bc: 250
  n_ic: 250

# ==========================================
# TRAINING CONFIGURATION
# ==========================================
training:
  device: "cpu"
  epochs: 20000
  lbfgs_epochs : 2000
  loss_weights:
    lambda_momentum: 10
    lambda_ic: 10
    lambda_bc: 100

test:
  nx: 20
  ny: 20
  nt: 10
  nF: 5

# ==========================================
# OPTIMIZER
# ==========================================
optimizer:
  name: "adam"                    
  lr: 0.001                        
  weight_decay: 0.0